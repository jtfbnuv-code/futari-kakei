/* ──────────────────────────────────────────────────────────────
   FUTARI NO KAKEI / Happy Home edition — design system 2026
   Pop × soft × minimal. Accessibility: >=44px tap targets,
   visible focus, reduced motion support, responsive single-column.
   ────────────────────────────────────────────────────────────── */
:root {
  --bg: #fff9f5;
  --paper: #ffffff;
  --ink: #413644;
  --sub: #817680;
  --green: #ee6f65;
  --deep: #d95551;
  --pale: #fff1ea;
  --mint: #b9e9d4;
  --orange: #ffd58c;
  --line: #f2e8e6;
  --red: #cf514e;
  --shadow: 0 14px 38px rgba(112, 66, 74, .065);
  --radius: 25px;
  --peach: #fff0e9;
  --coral: #ff766b;
  --butter: #fff1bb;
  --lavender: #ece4ff;
  --sky: #e0f3ff;
  --cardstroke: #f3e6e1;
}
html { scroll-behavior:smooth; }
body {
  background:
    radial-gradient(circle at -5% 0%, rgba(255, 217, 183, .33) 0, transparent 28rem),
    radial-gradient(circle at 100% 15%, rgba(208, 246, 226, .25), transparent 22rem),
    var(--bg);
  color:var(--ink);
  font-family:'Nunito','Noto Sans JP',-apple-system,BlinkMacSystemFont,sans-serif;
  font-weight:500;
}
button, input, textarea, select { font-family:inherit; }
button { -webkit-tap-highlight-color:transparent; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible,
select:focus-visible, summary:focus-visible, .dropzone:focus-within {
  outline: 3px solid #ffac87;
  outline-offset: 3px;
}
button:disabled { opacity:.55; }
.shell { max-width:1280px; grid-template-columns:245px minmax(0, 1fr); }
.sidebar {
  background:rgba(255,255,255,.66);
  border-right:1px solid #f9e7df;
  padding:31px 21px;
}
.brand .logo, .mobile-brand .mini-logo, .brand-icon {
  background:linear-gradient(135deg,#ff9b82,#ff756d);
  border-radius:17px;
  box-shadow:0 6px 14px #f57d6b25;
  font-size:23px;
}
.brand .logo { height:50px; width:50px; font-size:27px; }
.brand b { font-size:17px; letter-spacing:-.045em; }
.brand small { color:#ae8b83; font-weight:800; font-size:10px; letter-spacing:.12em; }
.side-title { color:#bd9b97; font-size:10px; }
.nav-item { color:#80747b; border-radius:16px; min-height:49px; margin-bottom:6px; }
.nav-item:hover { background:#fff3ed; color:#cc665f; }
.nav-item.active { background:linear-gradient(105deg,#ffe6df,#fff0e7); color:#d65b55; box-shadow:inset 0 0 0 1px #ffddd6; }
.nav-item.active svg { stroke-width:2.4; }
.sidebar-note { background:linear-gradient(135deg,#fff0ce,#ffe3d8); color:#89696b; border-radius:21px; padding:22px; }
.sidebar-note strong { color:#b35d59; font-size:14px; }
.sidebar-note svg { color:#e77a70; }
.main { padding:34px 42px 72px; }
.topbar { margin-bottom:24px; }
.topbar .desktop-greeting { font-size:12px; font-weight:700; color:#98828b; }
.avatar { width:43px; height:43px; border:1px solid #f9e2da; background:#fff4ec; color:#be6d65; box-shadow:0 4px 12px #f6c3b030; }
.avatar:hover { background:#ffe6d8; }
.chip { background:#ffefdc; color:#a66849; padding:9px 13px; font-size:11px; font-weight:800; }
.chip.cloud { color:#327964; background:#e4f8ed; }
.eyebrow { font-family:'Nunito',sans-serif; font-weight:900; letter-spacing:.17em; color:#e77c73; font-size:11px; }
.eyebrow span { color:#e8b44b; margin-left:3px; }
.page-heading { margin-bottom:21px; align-items:center; }

<script>
// 公開してよい Supabase Project URL と Publishable/anon key だけ設定してください。
// service_role / secret キーは絶対に入れないでください。
// 未設定のままなら、この端末だけに保存する無料ローカルモードで動きます。
window.FUTARI_CONFIG = {

// ブラウザ内で実行する無料の Tesseract OCR と、日本語レシート用の簡易解析。
// 外部の有料画像解析 API は使用しません。文字認識モデルは初回利用時にダウンロードされます。
(function () {
  'use strict';
  const categories = {
    'ペット': /ドッグ|キャット|ペット|犬用|猫用|ドライフード|おやつ犬|ちゅーる|トイレシート|ペットシーツ|ペットフード|シュプレモ|K9/i,
    '医療': /病院|薬局|処方|診察|診療|検査|歯科|薬品|医薬品|風邪薬|鎮痛|湿布|ばんそうこう|絆創膏|マスク/i,
    '日用品': /洗剤|柔軟剤|シャンプー|コンディショナー|歯ブラシ|歯磨き|ティッシュ|トイレット|トイレ|石けん|石鹸|ボディソープ|スポンジ|ラップ|アルミホイル|ゴミ袋|キッチンペーパー|タオル|消臭|電池|掃除|詰替|詰め替え|ハンドソープ|化粧水|日焼け止め/i,
    '交通': /乗車券|きっぷ|切符|駐車|ガソリン|給油|高速道路|タクシー|電車|バス運賃/i,
    '趣味': /書籍|雑誌|ゲーム|CD|DVD|イヤホン|文具|ペン|ノート|楽器/i,

  function categorize(name, store) {

  async function init(){const fromFile=window.FUTARI_CONFIG||{},stored=(()=>{try{return JSON.parse(localStorage.getItem(CONFIG_KEY)||'{}')}catch{return{}}})();state.config={url:stored.url||fromFile.supabaseUrl||'',key:stored.key||fromFile.supabasePublishableKey||''};const shouldCloud=state.config.url&&state.config.key&&!localStorage.getItem(MODE_KEY);if(shouldCloud){if(!window.supabase?.createClient){state.error='Supabaseライブラリを読み込めませんでした。通信環境を確認してください。';render();return;}try{state.cloud=window.supabase.createClient(state.config.url,state.config.key);state.cloudLoading=true;render();const result=await state.cloud.auth.getSession();if(result.error)throw result.error;state.user=result.data.session?.user||null;state.cloud.auth.onAuthStateChange((_event,session)=>{const old=state.user?.id;state.user=session?.user||null;if(old!==state.user?.id)setTimeout(()=>{void initHousehold()},0);});if(state.user)await initHousehold();else{state.cloudLoading=false;render();}}catch(e){state.cloudLoading=false;state.error=`共有の接続に失敗しました：${getError(e)}`;render();}}else render();}
  async function initHousehold(){if(!state.cloud)return;state.cloudLoading=true;render();try{if(!state.user){state.household=null;state.shopping=[];state.expenses=[];return;}const {data,error}=await state.cloud.rpc('get_my_household');if(error)throw error;state.household=Array.isArray(data)?data[0]||null:null;if(state.household){await loadCloud();subscribeCloud();}else{state.shopping=[];state.expenses=[];}}catch(e){state.error=`共有データの読み込みに失敗：${getError(e)}。SQL設定をご確認ください。`;state.household=null;}finally{state.cloudLoading=false;render();}}
  async function loadCloud(){if(!state.cloud||!state.household)return;const id=state.household.id;const [s,e]=await Promise.all([state.cloud.from('shopping_items').select('*').eq('household_id',id).order('created_at',{ascending:false}),state.cloud.from('expenses').select('*,expense_items(*)').eq('household_id',id).order('spent_on',{ascending:false}).order('created_at',{ascending:false})]);if(s.error)throw s.error;if(e.error)throw e.error;state.shopping=s.data||[];state.expenses=e.data||[];render();}
  let channel=null;function subscribeCloud(){if(!state.cloud||!state.household)return;if(channel)void state.cloud.removeChannel(channel);const refresh=()=>{void loadCloud().catch(e=>setNotice(getError(e),true));};channel=state.cloud.channel(`futari-${state.household.id}`).on('postgres_changes',{event:'*',schema:'public',table:'shopping_items',filter:`household_id=eq.${state.household.id}`},refresh).on('postgres_changes',{event:'*',schema:'public',table:'expenses',filter:`household_id=eq.${state.household.id}`},refresh).on('postgres_changes',{event:'*',schema:'public',table:'expense_items',filter:`household_id=eq.${state.household.id}`},refresh).subscribe();}
  async function run(task){if(state.busy)return;state.busy=true;state.error='';state.notice='';render();try{await task();}catch(e){state.error=getError(e);console.error(e);}finally{state.busy=false;render();}}
  function isPublicKey(key){
    if(key.startsWith('sb_publishable_'))return true;
    if(key.startsWith('sb_secret_'))return false;
    const parts=key.split('.');
    if(parts.length!==3)return false;
    try{const payload=JSON.parse(atob(parts[1].replace(/-/g,'+').replace(/_/g,'/')));return payload.role==='anon';}catch{return false;}
  }
  function getError(e){return typeof e==='string'?e:e?.message||'処理に失敗しました';}
  async function addShopping(name,quantity,memo){const item={id:uid(),household_id:state.household?.id||'local',name:name.trim().slice(0,120),quantity:quantity.trim().slice(0,40),memo:memo.trim().slice(0,500),is_done:false,created_by:state.user?.id||null,created_at:new Date().toISOString()};if(!item.name)throw Error('商品名を入力してください');if(state.cloud){const {error}=await state.cloud.from('shopping_items').insert({household_id:item.household_id,name:item.name,quantity:item.quantity,memo:item.memo,created_by:state.user.id});if(error)throw error;await loadCloud();}else{state.shopping.unshift(item);persist();}state.notice='買い物リストに追加しました';}
  async function updateShopping(id,changes){if(state.cloud){const {error}=await state.cloud.from('shopping_items').update(changes).eq('id',id).eq('household_id',state.household.id);if(error)throw error;await loadCloud();}else{state.shopping=state.shopping.map(i=>i.id===id?{...i,...changes}:i);persist();}}
  async function deleteShopping(id){if(state.cloud){const {error}=await state.cloud.from('shopping_items').delete().eq('id',id).eq('household_id',state.household.id);if(error)throw error;await loadCloud();}else{state.shopping=state.shopping.filter(i=>i.id!==id);persist();}}
  function updateEditorInput(el){if(el.dataset.model){state.editor[el.dataset.model]=el.value;}if(el.dataset.item){const i=state.editor.items.find(x=>x.key===el.dataset.item);if(i)i[el.dataset.field]=el.value;}}
  function editExpense(id){const e=state.expenses.find(x=>x.id===id);if(!e)return;clearReceipt();state.editor={id:e.id,store_name:e.store_name,spent_on:e.spent_on,total:String(e.total),payment_method:e.payment_method,memo:e.memo||'',receipt_path:e.receipt_path||null,items:(e.expense_items||[]).filter(i=>i.name!=='差額調整（自動）').map(i=>({key:uid(),name:i.name,quantity:i.quantity||'1',amount:String(i.amount),category:i.category}))};if(!state.editor.items.length)state.editor.items=[{key:uid(),name:'',quantity:'1',amount:'',category:'食費'}];state.entryMode='manual';route('receipt');}
  async function saveExpense(){const e=state.editor;const total=Number(e.total);if(!e.store_name.trim())throw Error('店舗名を入力してください');if(!/^\d{4}-\d{2}-\d{2}$/.test(e.spent_on)||Number.isNaN(new Date(e.spent_on+'T00:00').getTime()))throw Error('日付を入力してください');if(e.total===''||!Number.isSafeInteger(total)||total<0||total>100000000)throw Error('合計金額を入力してください');if(!e.items.length)throw Error('商品を1行以上入力してください');const items=e.items.map(i=>({name:i.name.trim().slice(0,120),quantity:i.quantity.trim().slice(0,40),amount:Number(i.amount),category:i.category}));if(items.some((i,j)=>!i.name||e.items[j].amount===''||!Number.isSafeInteger(i.amount)||Math.abs(i.amount)>100000000||!CATS.includes(i.category)))throw Error('明細の商品名・金額・カテゴリを確認してください');if(!e.id&&state.expenses.some(x=>x.store_name===e.store_name&&x.spent_on===e.spent_on&&x.total===total)&&!confirm('同じ店舗・日付・金額の記録があります。重複の可能性がありますが登録しますか？'))return;
    let path=e.receipt_path||null,uploaded=null;try{if(state.cloud&&state.receiptFile){uploaded=`${state.household.id}/${uid()}.jpg`;const blob=await compressImage(state.receiptFile);const {error}=await state.cloud.storage.from('receipts').upload(uploaded,blob,{contentType:'image/jpeg',upsert:false});if(error)throw error;path=uploaded;}if(state.cloud){const {error}=await state.cloud.rpc('save_expense',{p_household_id:state.household.id,p_expense_id:e.id||null,p_store_name:e.store_name.trim(),p_spent_on:e.spent_on,p_total:total,p_payment_method:e.payment_method,p_memo:e.memo,p_receipt_path:path,p_items:items});if(error)throw error;await loadCloud();}else{const sum=items.reduce((a,b)=>a+b.amount,0),adjust=sum===total?[]:[{name:'差額調整（自動）',quantity:'',amount:total-sum,category:'調整'}];const old=state.expenses.find(x=>x.id===e.id),id=e.id||uid(),expense={id,household_id:'local',store_name:e.store_name.trim(),spent_on:e.spent_on,total,payment_method:e.payment_method,memo:e.memo,receipt_path:null,created_at:old?.created_at||new Date().toISOString(),expense_items:[...items,...adjust].map(i=>({...i,id:uid(),expense_id:id,household_id:'local'}))};state.expenses=e.id?state.expenses.map(x=>x.id===id?expense:x):[expense,...state.expenses];persist();}}catch(err){if(uploaded&&state.cloud)await state.cloud.storage.from('receipts').remove([uploaded]);throw err;}const editing=Boolean(e.id);clearReceipt();state.editor=blankExpense();state.tab='history';state.month=e.spent_on.slice(0,7);state.notice=editing?'支出を更新しました':'支出を登録しました';}
  async function deleteExpense(id){const e=state.expenses.find(x=>x.id===id);if(!e)return;if(state.cloud){const {error}=await state.cloud.from('expenses').delete().eq('id',id).eq('household_id',state.household.id);if(error)throw error;if(e.receipt_path)await state.cloud.storage.from('receipts').remove([e.receipt_path]);await loadCloud();}else{state.expenses=state.expenses.filter(x=>x.id!==id);persist();}state.expanded=null;state.notice='支出を削除しました';}
  async function compressImage(file){const bitmap=await createImageBitmap(file);const ratio=Math.min(1,1800/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*ratio));canvas.height=Math.max(1,Math.round(bitmap.height*ratio));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();return await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(Error('画像を変換できませんでした')),'image/jpeg',.82));}
  async function readReceipt(){if(!state.receiptFile)throw Error('レシート画像を選んでください');state.ocrWorking=true;state.ocrProgress='準備中';render();try{const result=await window.FutariOCR.recognize(state.receiptFile,(stage,progress)=>{const pct=Math.round(progress*100);const s=`${pct}%`;if(state.ocrProgress!==s){state.ocrProgress=s;const btn=document.querySelector('[data-action="ocr"]');if(btn)btn.innerHTML=`<i class="loading-spinner"></i> 読み取り中 ${s}`;}});state.editor={...state.editor,store_name:result.store_name||state.editor.store_name,spent_on:result.spent_on||state.editor.spent_on,total:result.total===null?state.editor.total:String(result.total),items:result.items.length?result.items.map(i=>({...i,key:uid(),amount:i.amount===null?'':String(i.amount)})):state.editor.items};state.ocrRaw=result.raw;state.ocrWarn=result.warnings;state.notice='読み取りが完了しました。内容を確認してから保存してください。';}finally{state.ocrWorking=false;render();}}
  function safeCsvValue(v){let s=String(v??'');if(/^[\s]*[=+@-]/.test(s)&&!/^[\s]*-\d+(\.\d+)?$/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';}
  function downloadFile(name,content,mime){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type:mime}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
  function downloadCsv(){const rows=[['日付','店舗','商品','数量','カテゴリ','商品金額','レシート合計','支払い方法','メモ']];for(const e of state.expenses)for(const i of (e.expense_items||[]))rows.push([e.spent_on,e.store_name,i.name,i.quantity,i.category,i.amount,e.total,e.payment_method,e.memo]);downloadFile(`ふたりの家計_${today()}.csv`,'\ufeff'+rows.map(r=>r.map(safeCsvValue).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
  function backup(){downloadFile(`ふたりの家計_バックアップ_${today()}.json`,JSON.stringify({version:1,exported_at:new Date().toISOString(),shopping:state.shopping,expenses:state.expenses},null,2),'application/json');}
  function actionClick(el,e){const action=el.dataset.action,id=el.dataset.id;
    if(action==='nav')return route(el.dataset.tab);
    if(action==='dismiss'){state.notice='';state.error='';return render();}
    if(action==='month-prev'||action==='month-next'){state.month=moveMonth(state.month,action==='month-prev'?-1:1);return render();}
    if(action==='toggle-shopping'){const x=state.shopping.find(x=>x.id===id);if(x)void run(()=>updateShopping(id,{is_done:!x.is_done}));return;}
    if(action==='edit-shopping'){const x=state.shopping.find(x=>x.id===id);if(x){state.modal={type:'shopping-edit',item:x};render();}return;}
    if(action==='delete-shopping'){if(confirm('この買い物メモを削除しますか？'))void run(()=>deleteShopping(id));return;}
    if(action==='clear-done'){if(confirm('購入済みの項目をすべて削除しますか？'))void run(async()=>{for(const i of state.shopping.filter(x=>x.is_done))await deleteShopping(i.id);});return;}
    if(action==='modal-close'||action==='modal-backdrop'){if(action==='modal-backdrop'&&e.target!==el)return;state.modal=null;return render();}
    if(action==='new-receipt')return newReceipt(false);
    if(action==='manual')return newReceipt(true);
    if(action==='entry-photo'||action==='entry-manual'){state.entryMode=action==='entry-photo'?'photo':'manual';return render();}
    if(action==='add-item'){state.editor.items.push({key:uid(),name:'',quantity:'1',amount:'',category:'食費'});return render();}
    if(action==='remove-item'){state.editor.items=state.editor.items.filter(i=>i.key!==id);return render();}
    if(action==='ocr'){void run(()=>readReceipt());return;}
    if(action==='expand'){state.expanded=state.expanded===id?null:id;return render();}
    if(action==='edit-expense')return editExpense(id);
    if(action==='delete-expense'){if(confirm('この支出記録を削除しますか？'))void run(()=>deleteExpense(id));return;}
    if(action==='view-photo'){const x=state.expenses.find(x=>x.id===id);if(x?.receipt_path&&state.cloud)void run(async()=>{const {data,error}=await state.cloud.storage.from('receipts').createSignedUrl(x.receipt_path,120);if(error)throw error;const win=window.open(data.signedUrl,'_blank','noopener,noreferrer');if(!win)state.notice='ポップアップがブロックされました。ブラウザ設定をご確認ください。';});return;}
    if(action==='csv')return downloadCsv();
    if(action==='backup')return backup();
    if(action==='copy-code'){if(!navigator.clipboard?.writeText){setNotice('この環境ではコピーできません。コードを手動で共有してください。',true);return;}navigator.clipboard.writeText(state.household?.invite_code||'').then(()=>setNotice('招待コードをコピーしました')).catch(()=>setNotice('コピーできません。コードを手動で共有してください。',true));return;}
    if(action==='use-local'){localStorage.setItem(MODE_KEY,'1');location.reload();return;}
    if(action==='logout'){void run(async()=>{if(!state.cloud)return;const{error}=await state.cloud.auth.signOut();if(error)throw error;state.user=null;state.household=null;state.shopping=[];state.expenses=[];});return;}
    if(action==='auth-login'||action==='auth-signup'){state.authMode=action==='auth-login'?'login':'signup';state.error='';state.notice='';return render();}
    if(action==='house-create'||action==='house-join'){state.householdMode=action==='house-create'?'create':'join';state.error='';return render();}
  }
  document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)actionClick(el,e);});
  document.addEventListener('input',e=>{const el=e.target;if(el?.dataset?.model||el?.dataset?.item)updateEditorInput(el);});
  document.addEventListener('change',async e=>{const el=e.target;if(el?.dataset?.model||el?.dataset?.item)updateEditorInput(el);
    if(el.id==='receipt-file'){const file=el.files?.[0];if(!file)return;if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size>10*1024*1024){setNotice('JPEG / PNG / WebPの10MB以下の写真を選んでください。',true);return;}clearReceipt();state.receiptFile=file;state.receiptURL=URL.createObjectURL(file);render();}
    if(el.id==='backup-file'){const file=el.files?.[0];if(!file)return;try{const raw=JSON.parse(await file.text());if(!Array.isArray(raw.shopping)||!Array.isArray(raw.expenses))throw Error('バックアップ形式が正しくありません');if(state.cloud)throw Error('バックアップ復元はローカルモードのみ利用できます');if(!confirm('今あるローカルデータをバックアップの内容で上書きしますか？'))return;state.shopping=raw.shopping;state.expenses=raw.expenses;persist();setNotice('バックアップから復元しました');}catch(err){setNotice(getError(err),true);}}
  });
  document.addEventListener('submit',e=>{const form=e.target;if(!(form instanceof HTMLFormElement))return;e.preventDefault();const f=new FormData(form);if(form.getAttribute('id')==='shopping-add'){const name=String(f.get('name')||''),qty=String(f.get('quantity')||''),memo=String(f.get('memo')||'');void run(async()=>{await addShopping(name,qty,memo);form.reset();});return;}
    if(form.getAttribute('id')==='shopping-edit-form'){const id=String(f.get('id')||'');void run(async()=>{await updateShopping(id,{name:String(f.get('name')||'').trim(),quantity:String(f.get('quantity')||'').trim(),memo:String(f.get('memo')||'').trim()});state.modal=null;state.notice='買い物メモを更新しました';});return;}
    if(form.getAttribute('id')==='expense-form'){void run(saveExpense);return;}
    if(form.getAttribute('id')==='cloud-config'){const url=String(f.get('url')||'').trim().replace(/\/$/,''),key=String(f.get('key')||'').trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)){setNotice('SupabaseのProject URLを入力してください（https://...supabase.co）。',true);return;}if(!isPublicKey(key)){setNotice('Publishable key または anon key だけを設定してください。secret/service_role は使用できません。',true);return;}localStorage.setItem(CONFIG_KEY,JSON.stringify({url,key}));localStorage.removeItem(MODE_KEY);location.reload();return;}
    if(form.getAttribute('id')==='auth-form')void run(async()=>{const email=String(f.get('email')||''),password=String(f.get('password')||'');if(state.authMode==='login'){const {error}=await state.cloud.auth.signInWithPassword({email,password});if(error)throw error;await initHousehold();}else{const{data,error}=await state.cloud.auth.signUp({email,password});if(error)throw error;if(!data.session){state.notice='確認メールを送りました。メール内のリンクで認証してからログインしてください。';}else await initHousehold();}});
    if(form.getAttribute('id')==='house-form')void run(async()=>{const args=state.householdMode==='create'?{p_name:String(f.get('name')||''),p_display_name:String(f.get('display')||'')}:{p_invite_code:String(f.get('code')||'').trim().toUpperCase(),p_display_name:String(f.get('display')||'')};const{error}=await state.cloud.rpc(state.householdMode==='create'?'create_household':'join_household',args);if(error)throw error;await initHousehold();});
  });
  void init();

})();

</script>
